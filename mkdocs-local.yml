site_name: XmlNotepad
site_url: http://127.0.0.1:8000/
repo_url: https://github.com/microsoft/XmlNotepad
theme:
    name: null
    custom_dir: docs/windmill_dark
    # default from mkdocs_theme.yml
    static_templates:
        - 404.html
    include_search_page: true
    search_index_only: true
    history_buttons: true
    article_nav_top: true
    article_nav_bottom: true
    highlightjs: true
    features:
    - search.highlight

extra_javascript:
    - https://www.googletagmanager.com/gtag/js?id=UA-89203408-1
    - https://consentdeliveryfd.azurefd.net/mscc/lib/v2/wcp-consent.js
    - assets/js/cookies.js
    - assets/js/main.js

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/microsoft/XmlNotepad
  generator: false

markdown_extensions:
    - toc:
        permalink: "#"

nav:
  - Home: index.md
  - Install: install.md
  - Help:
    - Getting started: help/overview.md
    - Keyboard shortcuts: help/keyboard.md
    - Menus: help/menus.md
    - Find and Replace: help/find.md
    - Cut, copy, and paste: help/clipboard.md
    - Drag and drop: help/dragdrop.md
    - Schemas: help/schemas.md
    - IntelliSense: help/intellisense.md
    - Dynamic Help: help/dynamic.md
    - Validation: help/validation.md
    - XSLT: help/xslt.md
    - Options: help/options.md
    - Settings: help/settings.md
    - File associations: help/fileassociation.md
    - Updates: help/updates.md
  - Development:
    - Build and contribute: dev/index.md
    - Architecture: dev/design.md
