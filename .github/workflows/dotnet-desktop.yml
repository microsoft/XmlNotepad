name: WinUI desktop CI

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches:
      - master

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.0.x

    - name: Build XML Notepad (WinUI)
      run: dotnet build ./src/xmlnotepad.slnx --configuration $env:Configuration -p:Platform=x64 -warnaserror
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Run unit tests
      run: dotnet test ./src/UnitTests/UnitTests.csproj --configuration $env:Configuration --verbosity normal
      env:
        Configuration: ${{ matrix.configuration }}
